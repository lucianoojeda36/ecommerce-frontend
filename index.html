<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tienda online: descubrí productos de calidad, comprá seguro y recibí tu pedido en tu casa." />
    <meta name="theme-color" content="#3B82F6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Sans:wdth,wght@75..100,400..700&display=swap" rel="stylesheet" />
    <title>Mi Tienda · Comprá online</title>
    <script>
      try {
        var saved = localStorage.getItem('theme')
        document.documentElement.classList.add(saved === 'dark' ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.classList.add('light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
